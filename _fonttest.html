<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>font check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <pre id="out">running…</pre>
    <div id="probe" style="position:absolute;left:-9999px">
      <h1 class="page-title">Tiêu đề</h1>
      <p class="qprompt">Đề bài</p>
      <span class="material-symbols-outlined">home</span>
      <code class="mono">x = 1</code>
      <input class="field" value="Nhập đáp án" />
      <div id="katexhost"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script>
      // Checks the two-face setup: Be Vietnam Pro reads body copy, Baloo 2 is
      // reserved for headings and the brand. See the note in index.html for
      // why the split exists.
      var out = [];
      var pass = 0, fail = 0;
      function check(name, fn) {
        try {
          var r = fn();
          if (r === true) { pass++; out.push('PASS  ' + name); }
          else { fail++; out.push('FAIL  ' + name + '  -> ' + r); }
        } catch (e) { fail++; out.push('THROW ' + name + '  -> ' + e.message); }
      }

      // Width of a string rendered in a given font stack. If the browser had to
      // fall back, the width differs from the same text in the real font.
      function widthIn(text, family, weight) {
        var c = document.createElement('canvas').getContext('2d');
        c.font = (weight || 400) + ' 32px ' + family;
        return c.measureText(text).width;
      }

      var VN = 'Kiểm tra Toán Đại số Ứng dụng đạo hàm — Nguyễn Đặng Ơn Ữ ₫';

      var BODY_WEIGHTS = [400, 500, 600, 700];
      var DISPLAY_WEIGHTS = [600, 700, 800];

      // A browser only downloads the weights a page actually paints, so
      // `fonts.check()` alone would report unused cuts as missing. Request every
      // weight the app declares, up front.
      var loads = [document.fonts.ready];
      BODY_WEIGHTS.forEach(function (w) {
        loads.push(document.fonts.load(w + ' 16px "Be Vietnam Pro"', VN));
      });
      DISPLAY_WEIGHTS.forEach(function (w) {
        loads.push(document.fonts.load(w + ' 16px "Baloo 2"', VN));
      });

      Promise.all(loads).then(function () {
        // ---- the body face -------------------------------------------------
        check('Be Vietnam Pro đã tải', function () {
          return document.fonts.check('400 16px "Be Vietnam Pro"') ? true : 'chưa tải';
        });
        check('Be Vietnam Pro đủ nét ' + BODY_WEIGHTS.join('/') + ' (kèm chữ có dấu)', function () {
          var missing = [];
          BODY_WEIGHTS.forEach(function (w) {
            if (!document.fonts.check(w + ' 16px "Be Vietnam Pro"', VN)) missing.push(w);
          });
          return missing.length === 0 ? true : 'thiếu nét ' + missing.join(', ');
        });
        check('Be Vietnam Pro vẽ được toàn bộ chữ tiếng Việt', function () {
          var w = widthIn(VN, '"Be Vietnam Pro"');
          var wFallback = widthIn(VN, 'serif');
          return Math.abs(w - wFallback) > 1 ? true : 'trùng khít với serif -> đang fallback';
        });
        check('Không rơi về serif cho riêng ký tự có dấu', function () {
          // Compare a plain-ASCII word against the same word with diacritics.
          // If the diacritic version fell back, the per-character ratio jumps.
          var a = widthIn('Nguyen Dang On U', '"Be Vietnam Pro"');
          var b = widthIn('Nguyễn Đặng Ơn Ữ', '"Be Vietnam Pro"');
          var ratio = b / a;
          return ratio > 0.85 && ratio < 1.25 ? true : 'tỉ lệ bất thường ' + ratio.toFixed(3);
        });

        // ---- the display face ----------------------------------------------
        check('Baloo 2 đủ nét ' + DISPLAY_WEIGHTS.join('/') + ' (kèm chữ có dấu)', function () {
          var missing = [];
          DISPLAY_WEIGHTS.forEach(function (w) {
            if (!document.fonts.check(w + ' 16px "Baloo 2"', VN)) missing.push(w);
          });
          return missing.length === 0 ? true : 'thiếu nét ' + missing.join(', ');
        });
        check('nét 800 khác nét 600 (không phải bôi đậm giả)', function () {
          var w600 = widthIn(VN, '"Baloo 2"', 600);
          var w800 = widthIn(VN, '"Baloo 2"', 800);
          return Math.abs(w800 - w600) > 1
            ? true
            : 'hai nét cho ra cùng bề rộng -> trình duyệt đang tự bôi đậm';
        });
        check('hai face thực sự khác nhau', function () {
          var body = widthIn(VN, '"Be Vietnam Pro"', 700);
          var display = widthIn(VN, '"Baloo 2"', 700);
          return Math.abs(body - display) > 1
            ? true
            : 'cùng bề rộng -> nhiều khả năng một trong hai chưa tải';
        });

        check('Material Symbols đã tải', function () {
          return document.fonts.check('400 24px "Material Symbols Outlined"')
            ? true : 'chưa tải';
        });

        // ---- who gets which face -------------------------------------------
        check('body dùng Be Vietnam Pro', function () {
          var f = getComputedStyle(document.body).fontFamily;
          return f.indexOf('Be Vietnam Pro') !== -1 ? true : f;
        });
        check('tiêu đề dùng Baloo 2', function () {
          var f = getComputedStyle(document.querySelector('.page-title')).fontFamily;
          return f.indexOf('Baloo 2') !== -1 ? true : f;
        });
        check('đề bài KHÔNG dùng Baloo 2', function () {
          var f = getComputedStyle(document.querySelector('.qprompt')).fontFamily;
          return f.indexOf('Baloo 2') === -1 && f.indexOf('Be Vietnam Pro') !== -1 ? true : f;
        });
        check('ô nhập liệu dùng Be Vietnam Pro', function () {
          var f = getComputedStyle(document.querySelector('.field')).fontFamily;
          return f.indexOf('Be Vietnam Pro') !== -1 ? true : f;
        });
        check('icon KHÔNG dùng font chữ', function () {
          var f = getComputedStyle(document.querySelector('.material-symbols-outlined')).fontFamily;
          return f.indexOf('Material Symbols') !== -1 ? true : f;
        });
        check('code dùng monospace', function () {
          var f = getComputedStyle(document.querySelector('.mono')).fontFamily;
          return /mono|Consolas|Menlo|Cascadia/i.test(f) ? true : f;
        });
        check('công thức KaTeX giữ font riêng', function () {
          katex.render('x^2 + \\sqrt{y} = 1', document.getElementById('katexhost'),
                       { throwOnError: false });
          var node = document.querySelector('#katexhost .katex');
          if (!node) return 'không render được';
          var f = getComputedStyle(node).fontFamily;
          return f.indexOf('KaTeX') !== -1 ? true : f;
        });

        // ---- readability guards --------------------------------------------
        // These encode the "chữ nhức mắt" fix so a later edit cannot quietly
        // undo it: cramped leading is what made long stems tiring to read.
        check('thân trang giãn dòng ≥ 1.6', function () {
          var cs = getComputedStyle(document.body);
          var ratio = parseFloat(cs.lineHeight) / parseFloat(cs.fontSize);
          return ratio >= 1.6 ? true : 'line-height/font-size = ' + ratio.toFixed(2);
        });
        check('đề bài giãn dòng ≥ 1.7', function () {
          var cs = getComputedStyle(document.querySelector('.qprompt'));
          var ratio = parseFloat(cs.lineHeight) / parseFloat(cs.fontSize);
          return ratio >= 1.7 ? true : 'line-height/font-size = ' + ratio.toFixed(2);
        });

        out.unshift('==== ' + pass + ' PASS / ' + fail + ' FAIL ====');
        document.getElementById('out').textContent = out.join('\n');
      });
    </script>
  </body>
</html>
