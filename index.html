    <meta charset="UTF-8" />

    <title>AdaptiveMath — Học Toán THCS thích ứng</title>
    <meta
      name="description"
      content="Nền tảng học Toán THCS lớp 6, 7, 8, 9 theo Chương trình GDPT 2018."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>"
    />

    <!--
      ===================================================================
      CACHE BUSTING — bump ?v= on EVERY local URL below whenever you edit
      any .js or .css file, then redeploy.
      ===================================================================

      None of these filenames are content-hashed (there is no build step to
      hash them), so a browser that cached an older copy will happily keep
      using it. That is not merely "stale" — it is dangerous, because the
      browser mixes versions: a fresh sync.js next to a cached store.js threw
      "AM.store.onChange is not a function" and took the whole app down.

      index.html itself is served with `Cache-Control: no-cache` (see
      _headers), so it is always re-fetched. Changing the query string here
      therefore forces every dependent file to be re-fetched too, regardless
      of what the browser already has cached.
    -->

    <!--
      Fonts. Two faces, split by job — this split is the fix for the "chữ nhức
      mắt" reports.

      Be Vietnam Pro reads body text. It was drawn for Vietnamese, so its
      diacritics are proportioned as part of the design rather than stacked on
      top of a Latin face, and its open apertures survive the long question
      stems and theory pages where the eye strain actually happened.

      Baloo 2 is kept for headings and the brand only. It is a rounded display
      face with a very tall x-height and tight leading: excellent at 2rem for a
      page title, tiring at 1rem for six paragraphs of maths.

      Both carry the `vietnamese` subset (U+1EA0–1EF9 plus Ă Đ Ơ Ư and ₫), so
      every diacritic comes from the real typeface — no mismatched glyphs
      mid-word, which is its own kind of "lỗi phông chữ".

      Material Symbols uses `display=block`, NOT `swap`. An icon font with
      `swap` renders its ligature text while loading, so the page briefly shows
      the words "home", "logout", "quiz" instead of icons. `block` keeps the
      glyph invisible until the font arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
    />

    <!-- KaTeX (math rendering). If offline, latex.js falls back to raw text. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/app.css?v=9" />
  </head>

    <!-- Firebase — the "compat" builds are plain classic scripts, so they load

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <!-- Question bank: a plain .js file (not .json) so the bank also loads when

    <script src="data/questions.js?v=9"></script>
